# 카드 분류 체계 (기술 분야 · 제품군 · 영향)
#
# 이 파일이 분류 체계의 유일한 원본입니다. 코드는 시작할 때 이 파일을 읽고 검증합니다.
# - 노드를 추가·삭제하거나 키·라벨·설명을 바꾸면 revision을 1 올립니다.
#   (새 revision이 되면 `news-insight cards classify --backfill`이 기존 카드를 다시 분류합니다.)
# - key: 소문자·숫자·밑줄(영문 소문자로 시작, 40자 이하). 저장·필터·URL에 쓰이므로 되도록 바꾸지 않습니다.
# - label: 화면에 보이는 한국어 이름. description·examples: LLM 프롬프트에 그대로 들어갑니다.
# - max_labels: 카드 하나에 붙일 수 있는 최대 개수. 엔진이 모르는 키를 내면 버립니다(fail-closed).
# 상태: 초안 v1 (2026-10-04). 분류 체계 확정은 선택 마법사에서 진행합니다.
version: 1
revision: 1

# 모든 축에 공통으로 적용되는 분류 규칙 (프롬프트에 그대로 들어감)
guidance:
  - 기사 핵심과 직접 관련된 것만 고른다. 스치듯 언급된 분야·제품은 고르지 않는다.
  - 메모리·파운드리 증설 같은 반도체 자산 투자 자체는 분류 대상이 아니다. 이런 기사는 fields·products를 비우고 impact는 watch로 둔다.
  - chipset은 완제품의 성능·원가·출시 일정에 영향을 주는 부품 이슈에만 쓴다.
  - impact는 완제품(스마트폰·가전·TV·웨어러블 등) 사업 관점에서 판단한다. 판단이 어려우면 watch.

axes:
  field:
    max_labels: 2
    nodes:
      - key: ai
        label: 온디바이스 AI·모델
        description: 기기 안에서 도는 AI, 모델 경량화·추론 가속, 생성형 AI 기능과 AI 에이전트
        examples: [온디바이스 LLM, NPU 추론 최적화, 기기 내 AI 비서]
      - key: display
        label: 디스플레이
        description: 패널 기술(OLED·마이크로LED·LCD), 폴더블·롤러블 패널, 화질·주사율
        examples: [마이크로LED, 폴더블 OLED 주름, 저전력 LTPO]
      - key: network
        label: 통신·네트워크
        description: 5G·5G Advanced·6G, Wi-Fi·블루투스·UWB, 위성 통신, 모뎀
        examples: [6G 표준, Wi-Fi 7, 위성 문자]
      - key: chipset
        label: 칩셋·부품
        description: 완제품에 들어가는 AP·모뎀·메모리 등 부품의 성능·수급·원가 이슈 (반도체 설비 투자는 제외)
        examples: [스냅드래곤 신제품, 메모리 가격 상승의 완제품 원가 영향]
      - key: camera
        label: 카메라·센서
        description: 이미지 센서, 카메라 모듈·영상 처리, 각종 센서(ToF·라이다·환경)
        examples: [2억 화소 센서, 컴퓨테이셔널 포토그래피]
      - key: power
        label: 배터리·전력
        description: 배터리 셀·소재, 고속·무선 충전, 전력 효율과 발열 관리
        examples: [실리콘 음극 배터리, Qi2 충전]
      - key: robotics
        label: 로보틱스
        description: 가정용·서비스·휴머노이드 로봇, 로봇 지능과 구동 부품
        examples: [휴머노이드, 로봇청소기 자율주행]
      - key: xr
        label: XR·공간 컴퓨팅
        description: VR·AR·MR 기술, 공간 컴퓨팅 UX·콘텐츠, 스마트 글래스 기술
        examples: [AR 글래스 광학, 공간 컴퓨팅 OS]
      - key: health
        label: 헬스·바이오센싱
        description: 생체 신호 측정, 디지털 헬스 기능, 의료 인증과 건강 데이터
        examples: [비침습 혈당, 수면 무호흡 감지]
      - key: security
        label: 보안·프라이버시
        description: 기기·계정 보안, 취약점·해킹, 개인정보 보호와 암호화
        examples: [제로데이 취약점, 패스키, 온디바이스 프라이버시]
      - key: platform
        label: OS·플랫폼
        description: 모바일·가전 OS, 앱 생태계·앱 마켓, 개발 도구와 플랫폼 정책
        examples: [안드로이드 새 버전, 앱 마켓 수수료, 스마트싱스·Matter]
      - key: cloud
        label: 클라우드·엣지
        description: 클라우드·엣지 인프라와 서비스, 하이브리드 AI, 데이터센터 서비스(설비 투자 자체 제외)
        examples: [하이브리드 AI 추론, 엣지 서버]
      - key: mobility
        label: 모빌리티·SDV
        description: 소프트웨어 중심 차량(SDV), 차량 인포테인먼트·자율주행 SW, 차량 연결
        examples: [차량용 OS, 디지털 키, ADAS 소프트웨어]
      - key: materials
        label: 소재·지속가능성
        description: 신소재, 재활용·탄소 감축, 에너지 효율과 친환경 규제 대응
        examples: [재활용 알루미늄, 탄소중립 공정]
      - key: policy
        label: 정책·규제·표준
        description: 정부 정책·규제, 무역·관세, 표준화 기구 결정과 소송
        examples: [EU AI 법, 관세, 3GPP 표준 확정, 특허 소송]
  product:
    max_labels: 2
    nodes:
      - key: phone
        label: 스마트폰
        description: 바(bar)형 스마트폰과 피처폰
        examples: [갤럭시 S, 아이폰, 픽셀]
      - key: foldable
        label: 폴더블
        description: 폴더블·롤러블·트라이폴드 등 접거나 늘리는 기기
        examples: [갤럭시 Z 폴드, 플립]
      - key: tablet_pc
        label: 태블릿·PC
        description: 태블릿, 노트북, 데스크톱 PC와 주변기기
        examples: [갤럭시 탭, 아이패드, AI PC]
      - key: wearable
        label: 웨어러블
        description: 스마트워치, 무선 이어폰, 스마트 링 등 몸에 착용하는 기기
        examples: [갤럭시 워치, 버즈, 스마트 링]
      - key: tv_monitor
        label: TV·모니터
        description: TV, 모니터, 프로젝터와 사이니지
        examples: [OLED TV, 게이밍 모니터]
      - key: appliance
        label: 생활가전
        description: 냉장고·세탁기·에어컨·청소기 등 생활가전
        examples: [AI 세탁기, 비스포크 냉장고]
      - key: home_robot_iot
        label: 홈로봇·IoT
        description: 홈로봇, 스마트홈 기기·허브, IoT 센서
        examples: [홈로봇, 스마트 스피커, Matter 기기]
      - key: xr_device
        label: XR 기기
        description: VR·MR 헤드셋, AR·스마트 글래스
        examples: [헤드셋, AI 안경]
      - key: network_equipment
        label: 네트워크 장비
        description: 기지국·코어망·RAN 장비, 공유기와 통신 인프라 장비
        examples: [vRAN, 5G 기지국]
      - key: automotive
        label: 전장
        description: 차량용 디스플레이·인포테인먼트·전자 부품과 차량 시스템
        examples: [차량용 OLED, 인포테인먼트 시스템]
      - key: medical_device
        label: 의료기기
        description: 의료 인증 기기, 진단·모니터링 기기와 디지털 치료
        examples: [FDA 인증 심전도, 혈압 측정 기기]
  impact:
    max_labels: 1
    nodes:
      - key: opportunity
        label: 기회
        description: 신기술·신시장·경쟁사 약점 등 완제품 사업에 유리하게 쓸 수 있는 신호
      - key: risk
        label: 위험
        description: 경쟁 위협, 규제·소송, 공급망·원가 부담, 보안 사고 등 불리한 신호
      - key: watch
        label: 관찰
        description: 아직 방향이 정해지지 않았거나 영향이 작아 지켜볼 신호
