#           underscores and middle dots removed)
# name      display name (official spelling)          name_ko  Korean spelling
# kind      company (default) | startup | institute | regulator | standards_body
# region    headquarters: kr | us | cn | jp | tw | eu | other
# relation  to Samsung DX: self | competitor | supplier | partner | peer (default)
