version: 1
sources:
  # ── Track 1: IT 기술 뉴스 및 공식 소스 ──
  - key: the-verge
    name: The Verge
    track: news
    category: independent_media
    access_method: feed
    endpoint_url: https://www.theverge.com/rss/index.xml
    official_domain: theverge.com
    operator: Vox Media
    region: global_en
    language: en
    poll_class: news
    dx_relevance: 모바일·디스플레이·스마트홈 완제품 리뷰와 업계 동향 보도
    storage_right: metadata_only
  - key: ars-technica
    name: Ars Technica
    track: news
    category: independent_media
    access_method: feed
    endpoint_url: https://feeds.arstechnica.com/arstechnica/index
    official_domain: arstechnica.com
    operator: Condé Nast
    region: global_en
    language: en
    poll_class: news
    dx_relevance: 소비자 기기, 통신, 보안 기술의 심층 분석 기사
    storage_right: metadata_only
  - key: etnews
    name: 전자신문
    track: news
    category: independent_media
    access_method: feed
    endpoint_url: https://rss.etnews.com/Section901.xml
    official_domain: etnews.com
    operator: 전자신문사
    region: kr
    language: ko
    poll_class: news
    dx_relevance: 국내 전자·통신·가전 산업과 정책 동향 보도
    storage_right: metadata_only
  - key: itmedia-news
    name: ITmedia NEWS
    track: news
    category: independent_media
    access_method: feed
    endpoint_url: https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml
    official_domain: itmedia.co.jp
    operator: ITmedia Inc.
    region: jp
    language: ja
    poll_class: news
    dx_relevance: 일본 전자·모바일·AI 산업 뉴스와 제조사 발표
    storage_right: metadata_only
  - key: google-blog
    name: Google The Keyword
    track: news
    category: official_vendor
    access_method: feed
    endpoint_url: https://blog.google/rss/
    official_domain: blog.google
    operator: Google LLC
    region: global_en
    language: en
    poll_class: news
    dx_relevance: Android·온디바이스 AI·스마트홈 플랫폼 공식 발표
    storage_right: metadata_only

  # ── Track 2: 커뮤니티 및 공개 SNS ──
  - key: hacker-news
    name: Hacker News Front Page
    track: community
    category: dev_forum
    access_method: feed
    endpoint_url: https://news.ycombinator.com/rss
    official_domain: ycombinator.com
    operator: Y Combinator
    region: global_en
    language: en
    poll_class: community
    dx_relevance: 개발자 커뮤니티의 기술 화제와 오픈소스 반응 신호
    storage_right: metadata_only
  - key: bluesky-official
    name: Bluesky Official Account
    track: community
    category: open_social
    access_method: atproto
    endpoint_url: https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=bsky.app&limit=30
    official_domain: bsky.app
    operator: Bluesky Social PBC
    region: global_en
    language: en
    poll_class: community
    dx_relevance: 탈중앙 소셜 프로토콜과 공개 기술 커뮤니티 신호
    storage_right: metadata_only
    config:
      preset: bluesky_author_feed

  # ── Track 3: 논문·학회·표준·특허 ──
  - key: arxiv-cs-ai
    name: arXiv cs.AI (API)
    track: research_ip
    category: academic_paper
    access_method: feed
    endpoint_url: https://export.arxiv.org/api/query?search_query=cat:cs.AI&sortBy=submittedDate&sortOrder=descending&max_results=50
    official_domain: arxiv.org
    operator: Cornell University
    region: global_en
    language: en
    poll_class: research
    dx_relevance: 온디바이스 AI·에이전트·멀티모달 모델 연구 동향
    storage_right: metadata_only
  - key: openalex-works
    name: OpenAlex Works
    track: research_ip
    category: academic_index
    access_method: research_api
    endpoint_url: https://api.openalex.org/works?filter=from_publication_date:{today-7d},to_publication_date:{today},title.search:on-device&sort=publication_date:desc&per-page=50
    official_domain: openalex.org
    operator: OurResearch
    region: global_en
    language: en
    poll_class: research
    dx_relevance: DX 기술 키워드 기반 논문 메타데이터와 인용 신호
    storage_right: metadata_only
    config:
      preset: openalex_works

  # ── Track 4: GitHub 오픈소스 트렌드 ──
  - key: github-on-device-ai
    name: GitHub On-device AI Trend
    track: oss
    category: oss_trend
    access_method: github
    endpoint_url: https://api.github.com/search/repositories?q=on-device+llm+pushed:>{today-30d}&sort=stars&order=desc&per_page=50
    official_domain: github.com
    operator: GitHub, Inc.
    region: global_en
    language: en
    poll_class: slow
    dx_relevance: 온디바이스 LLM·NPU 추론 런타임 오픈소스 급상승 신호
    storage_right: metadata_only
    config:
      preset: github_search
      auth:
        secret: GITHUB_TOKEN
      probe_url: https://api.github.com/rate_limit
