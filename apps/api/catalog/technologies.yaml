# Technology registry seed (plan 09 §3-3): the third level of the technology axis.
#
# key     canonical keyword key (lower case; spaces, hyphens, underscores and middle dots
#         removed). Card keywords are normalised to these keys when cards are stored.
# label   display name
# theme   taxonomy v2 theme key (field__theme)
# aliases other spellings and translations (normalised when loaded)
# kind    technology (default) | standard | regulation | product_family
# status  active (default) | watch — watch items are promoted by the monthly review
#
# Edit in the console (기술 레지스트리) for day-to-day changes; this file is the seed that
# `news-insight technologies seed` upserts (existing console edits are kept).
