# CPC/IPC classification → technology field (plan 19 §2.2), for the 특허 menu.
#
# A patent's field is the field of its first classification found here (offices list the main
# classification first); a patent without one takes its card's field, else "other".
# Fields are the app's 12 taxonomy fields (taxonomy/catalog.py FIELDS).
#
# subclasses  four-character CPC/IPC subclass (section, class, subclass): "G06N"
# groups      subclass + main group, for the parts of a subclass that belong elsewhere:
#             "G06N 10" (quantum computing) inside G06N (AI). A group wins over its subclass.
#
# CPC and IPC share these symbols down to the main group, so one map serves both.
version: 1
subclasses:
  # ai · AI 모델·에이전트
  G06N: ai  # computing based on specific computational models (neural networks, ML)
  G06V: ai  # image or video recognition and understanding
  G10L: ai  # speech recognition, synthesis and processing
  G06K: ai  # pattern recognition, data presentation (older recognition codes)
  # semis · 반도체·컴퓨팅 HW
  H01L: semis  # semiconductor devices (incl. packaging, H01L 21/23/25)
  H10B: semis  # electronic memory devices
  H10D: semis  # inorganic electric semiconductor devices (2023 CPC)
  H10F: semis  # inorganic light-sensitive devices: image sensors, photodiodes
  G11C: semis  # static stores: memory circuits
  G11B: semis  # information storage on moving media (disks, optical storage)
  H01S: semis  # lasers (laser diodes, VCSELs)
  H03K: semis  # pulse technique: logic circuits
