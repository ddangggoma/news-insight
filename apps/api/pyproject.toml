[project]
name = "news-insight-api"
version = "0.1.0"
description = "Daily IT Intelligence Platform API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "celery[redis]>=5.5,<5.7",
  "fastapi>=0.116,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "selectolax>=0.4.13,<0.5",
  "sqlalchemy>=2.0.40,<2.1",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
news-insight = "news_insight.cli:app"

[dependency-groups]
dev = [
  "httpx2>=2.13,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_insight"]

[tool.pytest.ini_options]
addopts = "--strict-markers -q"
testpaths = ["tests"]
markers = [
  "db: requires the PostgreSQL test database",
  "redis: requires the Redis test database (db 15)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/news_insight/strategy/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["news_insight"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "feedparser"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["news_insight.jobs.*"]
disallow_untyped_decorators = false
