name: news-insight

x-python-env: &python-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-news_insight}
  REDIS_URL: redis://redis:6379/0
  TIMEZONE: Asia/Seoul
  LM_STUDIO_URL: ${LM_STUDIO_URL:-http://host.docker.internal:1234}
  LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-qwen/qwen3.8-27b}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-ddangggoma@gmail.com}
  SOURCE_SECRET_GITHUB_TOKEN: ${SOURCE_SECRET_GITHUB_TOKEN:-}
  SOURCE_SECRET_YOUTUBE_API_KEY: ${SOURCE_SECRET_YOUTUBE_API_KEY:-}
  SOURCE_SECRET_NAVER_CLIENT_ID: ${SOURCE_SECRET_NAVER_CLIENT_ID:-}
  SOURCE_SECRET_NAVER_CLIENT_SECRET: ${SOURCE_SECRET_NAVER_CLIENT_SECRET:-}
  CONSOLE_API_KEY: ${CONSOLE_API_KEY:?CONSOLE_API_KEY is required}
  PUBLIC_API_KEY: ${PUBLIC_API_KEY:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:8700}
  RADAR_CACHE: "true"
  CONSOLE_CACHE_SECONDS: "60"
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
  OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}

# every container keeps at most 5 x 20 MB of logs (json-file had no limit)
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-python-image: &python-image
  <<: *logging
  image: news-insight-api:${IMAGE_TAG:-local}
  # tini as PID 1: reaps healthcheck processes and forwards SIGTERM. Without it Docker could not
  # stop or replace these containers (zombie PIDs, hung deploys on 2026-10-05)
  init: true
  build:
    context: ./apps/api
  environment: *python-env
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-python-runtime: &python-runtime
  <<: *python-image
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    <<: *python-image
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *python-runtime
    command: ["uvicorn", "news_insight.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # spoken briefings rendered on the host (plan 13 A1); the API only reads the index
    volumes:
      - ./ops/media:/srv/media:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *python-runtime
    command: ["celery", "-A", "news_insight.jobs.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A news_insight.jobs.celery_app:celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 5

  scheduler:
    <<: *python-runtime
    command: ["celery", "-A", "news_insight.jobs.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  web:
    <<: *logging
    image: news-insight-web:${IMAGE_TAG:-local}
    init: true
    build:
      context: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
      CONSOLE_API_KEY: ${CONSOLE_API_KEY:?CONSOLE_API_KEY is required}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    <<: *logging
    image: postgres:16-alpine
    # 2026-10-05 audit: slow-query tracking, a cache above the 128 MB default, and the database
    # name in log lines (test databases share this server). The live server got the same values
    # with ALTER SYSTEM, so its container did not have to be recreated
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=512MB
      - -c
      - log_line_prefix=%m [%p] %d
      # radar aggregates over jsonb_array_elements get huge cost estimates, so JIT compiled
      # them: 2.3 s of compiling for 50 ms of work (2026-10-05); the corpus never needs JIT
      - -c
      - jit=off
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_insight}
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news_insight}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    <<: *logging
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    restart: unless-stopped

  caddy:
    <<: *logging
    image: news-insight-caddy:${IMAGE_TAG:-local}
    build:
      context: ./ops/caddy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-8700}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-8701}
      RATE_LIMIT_PAGES: ${RATE_LIMIT_PAGES:-120}
      RATE_LIMIT_RADAR: ${RATE_LIMIT_RADAR:-20}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-30}
    ports:
      - "${CADDY_HTTPS_PORT:-8700}:${CADDY_HTTPS_PORT:-8700}"
      - "${CADDY_HTTP_PORT:-8701}:${CADDY_HTTP_PORT:-8701}"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ops/media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
