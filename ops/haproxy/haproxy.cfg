# Front door on the live Mac (2026-10-17). Docker Desktop hands every connection to a published
# port to the container from its own gateway, so Caddy never saw a visitor's address: the
# console access log, logins and per-IP rate limits all showed 192.168.65.1. This proxy owns
# the public ports instead and passes each connection on unopened (TLS stays with Caddy) to
# Caddy's loopback-only ports, first sending a PROXY v2 header that names the visitor.
#
# launchd runs it (scripts/install-proxy.sh), which sets the four ports from .env:
#   CADDY_HTTPS_PORT / CADDY_HTTP_PORT        public ports (8700 / 8701)
#   CADDY_PUBLISH_HTTPS / CADDY_PUBLISH_HTTP  where compose publishes Caddy (127.0.0.1:8702 / 8703)
global
    maxconn 4000
    # Nothing per connection is logged: Caddy and the access log see every request. Startup
    # errors (a port still taken) go to stderr, which launchd keeps in ops/logs/proxy.log.

defaults
    mode tcp
    timeout connect 5s
    # idle limits only; Caddy closes idle keep-alive connections after 5 minutes itself
    timeout client 1h
    timeout server 1h
    timeout client-fin 30s
    timeout server-fin 30s

frontend https
    bind "[::]:${CADDY_HTTPS_PORT}" v4v6
    default_backend caddy_https

backend caddy_https
    server caddy "${CADDY_PUBLISH_HTTPS}" send-proxy-v2

frontend http
    bind "[::]:${CADDY_HTTP_PORT}" v4v6
    default_backend caddy_http

backend caddy_http
    server caddy "${CADDY_PUBLISH_HTTP}" send-proxy-v2
