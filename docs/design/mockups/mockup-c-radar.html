<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시안 C · 토픽 레이더형 — DX 인텔리전스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 공통 토큰: 시안 A·B·C가 함께 쓰는 디자인 시스템 초안 (계획서 02장) */
:root {
  --bg: oklch(0.985 0.003 250);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.965 0.006 250);
  --line: oklch(0.91 0.008 250);
  --ink: oklch(0.22 0.02 255);
  --ink-2: oklch(0.38 0.02 255);
  --ink-3: oklch(0.5 0.015 255);
  --accent: oklch(0.5 0.13 250);
  --accent-soft: oklch(0.95 0.03 250);
  --on-accent: oklch(0.99 0 0);
  --up: oklch(0.5 0.13 155);
  --down: oklch(0.55 0.18 25);
  --warn: oklch(0.58 0.13 70);
  --t-news: oklch(0.52 0.13 250);
  --t-community: oklch(0.56 0.15 50);
  --t-research: oklch(0.5 0.14 300);
  --t-oss: oklch(0.5 0.12 160);
  --heat: oklch(0.66 0.17 45);
  --heat-soft: oklch(0.965 0.03 60);
  --heat-ink: oklch(0.47 0.14 40);
  --heat-hot-ink: oklch(0.2 0.03 40);
  --overlay: oklch(0.2 0.02 255 / 0.4);
  --shadow: 0 1px 2px oklch(0.2 0.02 255 / 0.06), 0 10px 30px oklch(0.2 0.02 255 / 0.08);
  --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.17 0.01 255); --surface: oklch(0.21 0.012 255); --surface-2: oklch(0.25 0.014 255);
    --line: oklch(0.32 0.014 255); --ink: oklch(0.95 0.005 255); --ink-2: oklch(0.83 0.01 255); --ink-3: oklch(0.7 0.012 255);
    --accent: oklch(0.74 0.12 250); --accent-soft: oklch(0.3 0.05 250); --on-accent: oklch(0.18 0.02 255);
    --up: oklch(0.76 0.14 155); --down: oklch(0.73 0.15 25); --warn: oklch(0.8 0.13 80);
    --t-news: oklch(0.74 0.12 250); --t-community: oklch(0.77 0.13 55); --t-research: oklch(0.75 0.12 300); --t-oss: oklch(0.76 0.12 160);
    --heat: oklch(0.74 0.15 50); --heat-soft: oklch(0.29 0.05 50); --heat-ink: oklch(0.82 0.12 55); --heat-hot-ink: oklch(0.17 0.02 40);
    --overlay: oklch(0 0 0 / 0.55);
    --shadow: 0 1px 0 oklch(1 0 0 / 0.04), 0 10px 30px oklch(0 0 0 / 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.17 0.01 255); --surface: oklch(0.21 0.012 255); --surface-2: oklch(0.25 0.014 255);
  --line: oklch(0.32 0.014 255); --ink: oklch(0.95 0.005 255); --ink-2: oklch(0.83 0.01 255); --ink-3: oklch(0.7 0.012 255);
  --accent: oklch(0.74 0.12 250); --accent-soft: oklch(0.3 0.05 250); --on-accent: oklch(0.18 0.02 255);
  --up: oklch(0.76 0.14 155); --down: oklch(0.73 0.15 25); --warn: oklch(0.8 0.13 80);
  --t-news: oklch(0.74 0.12 250); --t-community: oklch(0.77 0.13 55); --t-research: oklch(0.75 0.12 300); --t-oss: oklch(0.76 0.12 160);
  --heat: oklch(0.74 0.15 50); --heat-soft: oklch(0.29 0.05 50); --heat-ink: oklch(0.82 0.12 55); --heat-hot-ink: oklch(0.17 0.02 40);
  --overlay: oklch(0 0 0 / 0.55);
  --shadow: 0 1px 0 oklch(1 0 0 / 0.04), 0 10px 30px oklch(0 0 0 / 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, h5 { margin: 0; line-height: 1.35; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--ink-3); }

/* 상단 고정 바 */
.demo-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 16px; font-size: 12.5px; background: var(--heat-soft); color: var(--heat-ink); border-bottom: 1px solid var(--line); }
.demo-bar b { font-weight: 700; }
.demo-bar nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.demo-bar nav a { text-decoration: none; padding: 2px 9px; border-radius: 6px; color: var(--ink-2); }
.demo-bar nav a[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; }

.app-head { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 20px; background: color-mix(in oklab, var(--surface) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.logo { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 800; }
.spacer { flex: 1; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font-size: 13.5px; padding: 5px 12px; border-radius: 7px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px oklch(0.2 0.02 255 / 0.14); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.icon-btn:hover { color: var(--ink); }
.head-link { font-size: 13.5px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.head-link:hover { color: var(--ink); }

/* 태그 · 영향 · 트랙 */
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 6px; white-space: nowrap; line-height: 1.7; }
.tag.field { color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); }
.tag.product { color: var(--ink-2); border: 1px dashed var(--line); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.d-news { background: var(--t-news); } .d-community { background: var(--t-community); } .d-research { background: var(--t-research); } .d-oss { background: var(--t-oss); }
.impact { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.i-opp { color: var(--up); background: color-mix(in oklab, var(--up) 13%, transparent); }
.i-risk { color: var(--down); background: color-mix(in oklab, var(--down) 12%, transparent); }
.i-watch { color: var(--ink-2); background: var(--surface-2); }
.new-badge { font-size: 10.5px; font-weight: 700; color: var(--heat-ink); background: var(--heat-soft); padding: 0 5px; border-radius: 4px; margin-left: 4px; }
.kwchips { display: flex; flex-wrap: wrap; gap: 6px; }
.kwchips span, .kwchips button { font-size: 12.5px; padding: 2px 9px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); border: 0; }
.kwchips .hot { background: var(--heat-soft); color: var(--heat-ink); font-weight: 600; }
.spark { display: block; overflow: visible; }

/* 기사 상세 시트 (B·C 공용) */
.sheet-backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 50; }
.sheet { position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); box-shadow: var(--shadow); padding: 22px 24px 32px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.sheet h2 { font-size: 21px; font-weight: 700; line-height: 1.4; }
.sheet .orig { font-size: 13px; color: var(--ink-3); }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink); font-size: 15.5px; line-height: 1.75; }
.sheet .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.sheet h4 { font-size: 13px; color: var(--ink-3); font-weight: 600; margin-top: 6px; }
.sheet .related { display: grid; gap: 8px; }
.sheet .related button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 12px; font-size: 14px; line-height: 1.45; }
.sheet .close { justify-self: end; }
.sheet .src-link { font-size: 13.5px; color: var(--accent); }

/* 시안 C: KPI 띠 / 히트맵 + 상세 / 모멘텀·하이프 지도 / 키워드 수명주기 */
.logo { background: var(--heat); color: var(--heat-hot-ink); }
.seg button[aria-pressed="true"] { color: var(--heat-ink); }
.range { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
.wrap { max-width: 1440px; margin-inline: auto; padding: 20px 24px 60px; display: grid; gap: 18px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi span { font-size: 12.5px; color: var(--ink-3); }
.kpi b { font-size: 24px; font-weight: 600; line-height: 1.3; }
.kpi b.txt { font-size: 18px; }
.kpi small { font-size: 12.5px; color: var(--ink-3); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.box-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.box-head h2 { font-size: 15.5px; font-weight: 700; }
.box-head span { font-size: 12.5px; color: var(--ink-3); }
.main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr); gap: 18px; align-items: start; }
.heat-wrap { overflow-x: auto; }
table.heat { border-collapse: separate; border-spacing: 3px; width: 100%; font-size: 12px; }
.heat th { font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 2px 4px; white-space: nowrap; }
.heat thead th { text-align: center; vertical-align: bottom; }
.heat tbody th { text-align: right; color: var(--ink-2); position: sticky; left: 0; background: var(--surface); z-index: 1; }
.heat td { padding: 0; min-width: 52px; }
.heat button { width: 100%; height: 40px; border: 0; border-radius: 6px; display: grid; place-items: center; line-height: 1.1; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2);
  background: color-mix(in oklab, var(--heat) calc(var(--v) * 1%), var(--surface-2)); }
.heat button.hot { color: var(--heat-hot-ink); font-weight: 600; }
.heat button small { font-size: 10px; }
.heat button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.heat button:hover { filter: brightness(0.96); }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.legend i { height: 8px; flex: 0 0 120px; border-radius: 4px; background: linear-gradient(90deg, var(--surface-2), var(--heat)); }
.toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; font-size: 12.5px; color: var(--ink-2); }
.detail { position: sticky; top: 76px; }
.detail h3 { font-size: 19px; font-weight: 700; }
.detail .sub { font-size: 12.5px; color: var(--ink-3); }
.detail .block { display: grid; gap: 6px; }
.chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.chain b { font-weight: 600; padding: 2px 9px; border-radius: 6px; background: var(--surface-2); }
.arts { display: grid; gap: 6px; }
.arts button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 9px 11px; display: grid; gap: 2px; font-size: 14px; line-height: 1.45; }
.arts button:hover { border-color: var(--heat); }
.arts button span { font-size: 12px; color: var(--ink-3); }
.lower { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
table.mom { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.mom th { text-align: left; font-size: 12px; color: var(--ink-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mom td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mom td.r, .mom th.r { text-align: right; }
.mom tr:last-child td { border-bottom: 0; }
.state { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.st-new { color: var(--heat-ink); background: var(--heat-soft); }
.st-rise { color: var(--up); background: color-mix(in oklab, var(--up) 13%, transparent); }
.st-steady { color: var(--ink-2); background: var(--surface-2); }
.st-fall { color: var(--down); background: color-mix(in oklab, var(--down) 12%, transparent); }
.hype svg { width: 100%; height: auto; display: block; }
.hype text { font-family: var(--font-sans); }
.life { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.life > div { display: grid; gap: 6px; align-content: start; }
.life h3 { font-size: 12.5px; font-weight: 700; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.life .kwl { display: grid; grid-template-columns: minmax(0, 1fr) 56px 50px; gap: 6px; align-items: center; font-size: 13.5px; padding: 5px 9px; border-radius: 8px; background: var(--surface-2); }
.life .kwl .num { font-size: 12px; text-align: right; }

@media (max-width: 1100px) {
  .main, .lower { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; }
}
@media (max-width: 720px) {
  .wrap { padding: 14px 16px 40px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .life { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .app-head { padding: 8px 16px; gap: 8px; }
  .app-head .head-link, .range { display: none; }
  .mom .hide-sm { display: none; }
}
@media (max-width: 440px) { .life { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="demo-bar"><b>예시 데이터</b> 시안 C · 토픽 레이더형 — 실제 수집 데이터가 아닙니다
  <nav aria-label="시안"><a href="mockup-a-briefing.html">A 브리핑</a><a href="mockup-b-explore.html">B 탐색</a><a href="mockup-c-radar.html" aria-current="page">C 레이더</a></nav>
</div>
<header class="app-head">
  <a class="brand" href="#"><span class="logo">DX</span>DX 인텔리전스</a>
  <div class="seg" id="period" aria-label="기간">
    <button aria-pressed="false" data-p="day">일간</button><button aria-pressed="true" data-p="week">주간</button><button aria-pressed="false" data-p="month">월간</button><button aria-pressed="false" data-p="quarter">분기</button>
  </div>
  <span class="range num" id="range"></span>
  <span class="spacer"></span>
  <a class="head-link" href="mockup-a-briefing.html">오늘 브리핑</a>
  <a class="head-link" href="mockup-b-explore.html">탐색</a>
  <button class="icon-btn" id="theme" aria-label="밝게/어둡게 전환">◐</button>
</header>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="main">
    <section class="box">
      <div class="box-head"><h2>기술 분야 × 제품군</h2><span>칸 = 기사 수 · 아래 숫자 = 이전 기간 대비</span></div>
      <div class="heat-wrap"><table class="heat" id="heat"></table></div>
      <div class="legend"><span>적음</span><i></i><span>많음</span><span style="flex:1"></span><button class="toggle" id="all">전체 23 × 18 보기</button></div>
    </section>
    <section class="box detail" id="detail" aria-live="polite"></section>
  </div>
  <div class="lower">
    <section class="box">
      <div class="box-head"><h2>분야 모멘텀</h2><span>기사 수 · 변화 · 최근 8개 기간 추세</span></div>
      <div style="overflow-x:auto"><table class="mom" id="mom"></table></div>
    </section>
    <section class="box hype">
      <div class="box-head"><h2>관심 대비 실체</h2><span>가로 = 언론·커뮤니티 증가율, 세로 = 논문·오픈소스 증가율</span></div>
      <div id="hype"></div>
      <p style="font-size:13px;color:var(--ink-2)">오른쪽 아래는 화제는 많지만 연구·구현 활동이 따라오지 않는 분야, 왼쪽 위는 조용히 연구가 쌓이는 분야입니다.</p>
    </section>
  </div>
  <section class="box">
    <div class="box-head"><h2>키워드 수명주기</h2><span>신규 → 급상승 → 지속 → 하락</span></div>
    <div class="life" id="life"></div>
  </section>
</div>
<script>
// 예시(가라) 데이터 — 실제 수집 데이터가 아닙니다. 분류 키는 R2의 taxonomy.yaml 초안과 같습니다.
var FIELD = {
  ai: '온디바이스 AI', display: '디스플레이', network: '통신·네트워크', chipset: '칩셋·부품', camera: '카메라·센서',
  power: '배터리·전력', robotics: '로보틱스', xr: 'XR·공간 컴퓨팅', health: '헬스·바이오센싱', security: '보안·프라이버시',
  platform: 'OS·플랫폼', cloud: '클라우드·엣지', mobility: '모빌리티·SDV', materials: '소재·지속가능성', policy: '정책·규제·표준',
  audio: '오디오·음향', smarthome: '스마트홈 연결', genai_service: '생성형 AI 서비스', devtools: '개발 도구·SDK',
  commerce: '결제·디지털 지갑', energy: '에너지 관리', manufacturing: '스마트 제조', quantum: '양자 기술'
};
var PRODUCT = {
  phone: '스마트폰', foldable: '폴더블', tablet_pc: '태블릿·PC', wearable: '웨어러블', tv_monitor: 'TV·모니터',
  appliance: '생활가전', home_robot_iot: '홈로봇·IoT', xr_device: 'XR 기기', network_equipment: '네트워크 장비',
  automotive: '전장', medical_device: '의료기기',
  earbuds_audio: '이어버드·오디오', smart_speaker: '스마트 스피커·허브', signage: '상업용 디스플레이', hvac: '공조·HVAC',
  home_energy: '가정용 에너지 기기', pc_peripheral: 'PC 주변기기', camera_drone: '카메라·드론'
};

function hoursLabel(h) { return h < 1 ? '방금' : h < 24 ? h + '시간 전' : Math.round(h / 24) + '일 전'; }

function spark(values, w, h, color, fill) {
  var max = Math.max.apply(null, values), min = Math.min.apply(null, values);
  var span = max - min || 1, step = w / (values.length - 1);
  var pts = values.map(function (v, i) { return [i * step, h - 2 - ((v - min) / span) * (h - 4)]; });
  var line = pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  var last = pts[pts.length - 1];
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
    (fill === false ? '' : '<polygon points="0,' + h + ' ' + line + ' ' + w + ',' + h + '" fill="' + color + '" fill-opacity="0.14"></polygon>') +
    '<polyline points="' + line + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linejoin="round"></polyline>' +
    '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.4" fill="' + color + '"></circle></svg>';
}

}

    var fs = fieldsOrdered(), ps = productsOrdered();
    if (!showAll) { fs = fs.slice(0, 12); ps = ps.slice(0, 10); }
    var max = 0; fs.forEach(function (f) { ps.forEach(function (p) { max = Math.max(max, cell(f, p).v); }); });
    var html = '<thead><tr><th></th>' + ps.map(function (p) { return '<th scope="col">' + PRODUCT[p] + '</th>'; }).join('') + '</tr></thead><tbody>';
    fs.forEach(function (f) {
      html += '<tr><th scope="row">' + FIELD[f] + '</th>';
      ps.forEach(function (p) {
        var c = cell(f, p), v = Math.round(Math.sqrt(c.v / max) * 92);
        var arrow = c.ch > 0 ? '▲' + c.ch + '%' : c.ch < 0 ? '▼' + (-c.ch) + '%' : '–';
        var on = sel[0] === f && sel[1] === p;
        html += '<td><button class="' + (v >= 50 ? 'hot' : '') + '" style="--v:' + v + '" data-f="' + f + '" data-p="' + p + '" aria-pressed="' + on + '" aria-label="' + FIELD[f] + ' × ' + PRODUCT[p] + ' ' + c.v + '건, ' + arrow + '">' + c.v.toLocaleString('ko-KR') + '<small>' + arrow + '</small></button></td>';
      });
      html += '</tr>';
    });
    document.getElementById('heat').innerHTML = html + '</tbody>';
    document.getElementById('all').textContent = showAll ? '상위 12 × 10만 보기' : '전체 23 × 18 보기';
  }

  function renderDetail() {
    var f = sel[0], p = sel[1], c = cell(f, p);
    var arts = ARTICLES.filter(function (a) { return a.f.indexOf(f) >= 0 && a.p.indexOf(p) >= 0; });
    var fallback = !arts.length;
    if (fallback) arts = ARTICLES.filter(function (a) { return a.f.indexOf(f) >= 0; });
    var kws = {}; arts.forEach(function (a) { a.kw.forEach(function (k) { kws[k] = (kws[k] || 0) + 1; }); });
    var hot = {}; KEYWORDS.forEach(function (k) { if (k.state === 'new' || k.state === 'rise') hot[k.k] = 1; });
    var tr = arts.map(function (a) { return a.tr; });
    var chain = ['research', 'oss', 'community', 'news'].filter(function (t) { return tr.indexOf(t) >= 0; }).map(function (t) { return TRACK[t]; });
    var days = Math.round(6 + rnd(f + p) * 14);
    document.getElementById('detail').innerHTML =
      '<div class="block"><span class="sub">선택한 칸</span><h3>' + FIELD[f] + ' × ' + PRODUCT[p] + '</h3>' +
      '<span class="sub"><b class="num" style="color:var(--ink)">' + c.v.toLocaleString('ko-KR') + '건</b> · <span class="num ' + (c.ch >= 0 ? 'up' : 'down') + '">' + (c.ch >= 0 ? '▲ ' : '▼ ') + Math.abs(c.ch) + '%</span> 이전 기간 대비</span></div>' +
      '<div class="block"><span class="sub">최근 8개 기간 추세</span>' + spark(trendFor(f, p), 300, 56, 'var(--heat)') + '</div>' +
      '<div class="block"><span class="sub">핵심 키워드 (색 = 신규·급상승)</span><div class="kwchips">' + Object.keys(kws).slice(0, 8).map(function (k) { return '<span class="' + (hot[k] ? 'hot' : '') + '">' + esc(k) + '</span>'; }).join('') + '</div></div>' +
      '<div class="block"><span class="sub">교차 신호 체인' + (chain.length > 1 ? ' · 첫 신호에서 언론까지 평균 ' + days + '일' : '') + '</span><div class="chain">' + (chain.length ? chain.map(function (s) { return '<b>' + s + '</b>'; }).join('<span>→</span>') : '<span class="muted">아직 연결된 신호가 없습니다</span>') + '</div></div>' +
      '<div class="block"><span class="sub">대표 기사' + (fallback ? ' (같은 분야)' : '') + '</span><div class="arts">' + arts.slice(0, 4).map(function (a) { return '<button data-article="' + ARTICLES.indexOf(a) + '">' + esc(a.t) + '<span>' + TRACK[a.tr] + ' · ' + esc(a.src) + ' · ' + hoursLabel(a.h) + '</span></button>'; }).join('') + '</div></div>' +
      '<a class="head-link" style="color:var(--accent)" href="mockup-b-explore.html">이 조합으로 탐색 열기 →</a>';
  }

  function fieldStats(f) {
    var total = 0, chs = [];
    productsOrdered().forEach(function (p) { var c = cell(f, p); total += c.v; chs.push(c.ch); });
    var ch = Math.round(chs.reduce(function (a, b) { return a + b; }, 0) / chs.length + (rnd(f + period + 'm') - 0.4) * 20);
    var trend = []; for (var i = 0; i < 7; i++) trend.push(Math.round(total / (1 + ch / 100) * (0.8 + rnd(f + i + period) * 0.3))); trend.push(total);
    var stt = ch > 25 ? 'rise' : ch < -10 ? 'fall' : 'steady';
    if (f === 'genai_service' || f === 'quantum') stt = 'new';
    return { total: total, ch: ch, trend: trend, state: stt };
  }
  function renderMomentum() {
    var STATE = { new: ['st-new', '신규'], rise: ['st-rise', '급상승'], steady: ['st-steady', '지속'], fall: ['st-fall', '하락'] };
    var rows = Object.keys(FIELD).map(function (f) { var s = fieldStats(f); s.f = f; return s; }).sort(function (a, b) { return b.ch - a.ch; }).slice(0, 12);
    var sum = rows.reduce(function (a, r) { return a + r.total; }, 0);
    document.getElementById('mom').innerHTML = '<thead><tr><th>분야</th><th class="r">기사</th><th class="r">변화</th><th class="hide-sm">추세</th><th class="r hide-sm">점유율</th><th>상태</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><td>' + FIELD[r.f] + '</td><td class="r num">' + r.total.toLocaleString('ko-KR') + '</td><td class="r num ' + (r.ch >= 0 ? 'up' : 'down') + '">' + (r.ch >= 0 ? '+' : '') + r.ch + '%</td>' +
          '<td class="hide-sm">' + spark(r.trend, 80, 20, r.ch >= 0 ? 'var(--up)' : 'var(--down)', false) + '</td><td class="r num hide-sm">' + (r.total / sum * 100).toFixed(1) + '%</td>' +
          '<td><span class="state ' + STATE[r.state][0] + '">' + STATE[r.state][1] + '</span></td></tr>';
      }).join('') + '</tbody>';
  }

  function renderHype() {
    var W = 520, H = 300, L = 44, R = 16, T = 16, B = 36;
    var pts = Object.keys(FIELD).slice(0, 12).map(function (f) {
      return { f: f, x: Math.round((rnd(f + period + 'x') - 0.25) * 120), y: Math.round((rnd(f + period + 'y') - 0.3) * 100) };
    });
    var special = { robotics: { x: 140, y: 6 }, xr: { x: 32, y: -18 }, network: { x: 8, y: 62 }, quantum: { x: -4, y: 48 } };
    pts.forEach(function (p) { if (special[p.f]) { p.x = special[p.f].x; p.y = special[p.f].y; } });
    var xMin = -40, xMax = 160, yMin = -40, yMax = 80;
    function sx(v) { return L + (v - xMin) / (xMax - xMin) * (W - L - R); }
    function sy(v) { return T + (yMax - v) / (yMax - yMin) * (H - T - B); }
    var g = '';
    [-40, 0, 40, 80, 120, 160].forEach(function (v) { g += '<line x1="' + sx(v) + '" x2="' + sx(v) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--line)" stroke-width="1"></line><text x="' + sx(v) + '" y="' + (H - B + 16) + '" font-size="11" text-anchor="middle" fill="var(--ink-3)">' + v + '%</text>'; });
    [-40, 0, 40, 80].forEach(function (v) { g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + sy(v) + '" y2="' + sy(v) + '" stroke="var(--line)" stroke-width="1"></line><text x="' + (L - 6) + '" y="' + (sy(v) + 4) + '" font-size="11" text-anchor="end" fill="var(--ink-3)">' + v + '%</text>'; });
    g += '<line x1="' + sx(0) + '" x2="' + sx(0) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--ink-3)" stroke-width="1"></line><line x1="' + L + '" x2="' + (W - R) + '" y1="' + sy(0) + '" y2="' + sy(0) + '" stroke="var(--ink-3)" stroke-width="1"></line>';
    g += '<line x1="' + sx(-40) + '" y1="' + sy(-40) + '" x2="' + sx(80) + '" y2="' + sy(80) + '" stroke="var(--ink-3)" stroke-dasharray="4 4" stroke-width="1"></line>';
    var placed = [];
    pts.sort(function (a, b) { return sy(a.y) - sy(b.y); }).forEach(function (p) {
      var gap = p.x - p.y, col = gap > 60 ? 'var(--down)' : gap < -30 ? 'var(--up)' : 'var(--heat)';
      var lx = sx(p.x) + 7, ly = sy(p.y) + 4, lw = FIELD[p.f].length * 11;
      if (lx + lw > W - R) lx = sx(p.x) - 7 - lw;
      placed.forEach(function (q) { if (Math.abs(q.x - lx) < Math.max(q.w, lw) && Math.abs(q.y - ly) < 13) ly = q.y + 13; });
      placed.push({ x: lx, y: ly, w: lw });
      g += '<circle cx="' + sx(p.x) + '" cy="' + sy(p.y) + '" r="5" fill="' + col + '"></circle><text x="' + lx + '" y="' + ly + '" font-size="11.5" fill="var(--ink-2)">' + FIELD[p.f] + '</text>';
    });
    document.getElementById('hype').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="분야별 언론 증가율과 연구·구현 증가율 산점도">' + g + '</svg>';
  }

  function renderLife() {
    var lanes = [['new', '신규 등장', 'st-new'], ['rise', '급상승', 'st-rise'], ['steady', '지속 관심', 'st-steady'], ['fall', '하락', 'st-fall']];
    document.getElementById('life').innerHTML = lanes.map(function (l) {
      var items = KEYWORDS.filter(function (k) { return k.state === l[0]; });
      return '<div><h3><span class="state ' + l[2] + '">' + l[1] + '</span><span class="num">' + items.length + '</span></h3>' + items.map(function (k) {
        var neg = k.d.indexOf('−') === 0;
        return '<div class="kwl"><span>' + k.k + '</span>' + spark(k.s, 56, 16, neg ? 'var(--down)' : 'var(--heat)', false) + '<span class="num ' + (neg ? 'down' : k.state === 'steady' ? '' : 'up') + '">' + k.d + '</span></div>';
      }).join('') + '</div>';
    }).join('');
  }

  function renderAll() { renderKpis(); renderHeat(); renderDetail(); renderMomentum(); renderHype(); renderLife(); }

  document.getElementById('heat').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-f]'); if (!b) return;
    sel = [b.dataset.f, b.dataset.p]; renderHeat(); renderDetail();
    if (window.innerWidth <= 1100) document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.getElementById('all').addEventListener('click', function () { showAll = !showAll; renderHeat(); });
  var btns = document.querySelectorAll('#period button');
  btns.forEach(function (b) { b.addEventListener('click', function () { btns.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); period = b.dataset.p; renderAll(); }); });
  renderAll();
  initTheme();
})();
</script>
</body>
</html>
