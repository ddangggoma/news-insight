<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시안 B · 탐색 워크벤치형 — DX 인텔리전스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 공통 토큰: 시안 A·B·C가 함께 쓰는 디자인 시스템 초안 (계획서 02장) */
:root {
  --bg: oklch(0.985 0.003 250);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.965 0.006 250);
  --line: oklch(0.91 0.008 250);
  --ink: oklch(0.22 0.02 255);
  --ink-2: oklch(0.38 0.02 255);
  --ink-3: oklch(0.5 0.015 255);
  --accent: oklch(0.5 0.13 250);
  --accent-soft: oklch(0.95 0.03 250);
  --on-accent: oklch(0.99 0 0);
  --up: oklch(0.5 0.13 155);
  --down: oklch(0.55 0.18 25);
  --warn: oklch(0.58 0.13 70);
  --t-news: oklch(0.52 0.13 250);
  --t-community: oklch(0.56 0.15 50);
  --t-research: oklch(0.5 0.14 300);
  --t-oss: oklch(0.5 0.12 160);
  --heat: oklch(0.66 0.17 45);
  --heat-soft: oklch(0.965 0.03 60);
  --heat-ink: oklch(0.47 0.14 40);
  --heat-hot-ink: oklch(0.2 0.03 40);
  --overlay: oklch(0.2 0.02 255 / 0.4);
  --shadow: 0 1px 2px oklch(0.2 0.02 255 / 0.06), 0 10px 30px oklch(0.2 0.02 255 / 0.08);
  --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.17 0.01 255); --surface: oklch(0.21 0.012 255); --surface-2: oklch(0.25 0.014 255);
    --line: oklch(0.32 0.014 255); --ink: oklch(0.95 0.005 255); --ink-2: oklch(0.83 0.01 255); --ink-3: oklch(0.7 0.012 255);
    --accent: oklch(0.74 0.12 250); --accent-soft: oklch(0.3 0.05 250); --on-accent: oklch(0.18 0.02 255);
    --up: oklch(0.76 0.14 155); --down: oklch(0.73 0.15 25); --warn: oklch(0.8 0.13 80);
    --t-news: oklch(0.74 0.12 250); --t-community: oklch(0.77 0.13 55); --t-research: oklch(0.75 0.12 300); --t-oss: oklch(0.76 0.12 160);
    --heat: oklch(0.74 0.15 50); --heat-soft: oklch(0.29 0.05 50); --heat-ink: oklch(0.82 0.12 55); --heat-hot-ink: oklch(0.17 0.02 40);
    --overlay: oklch(0 0 0 / 0.55);
    --shadow: 0 1px 0 oklch(1 0 0 / 0.04), 0 10px 30px oklch(0 0 0 / 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.17 0.01 255); --surface: oklch(0.21 0.012 255); --surface-2: oklch(0.25 0.014 255);
  --line: oklch(0.32 0.014 255); --ink: oklch(0.95 0.005 255); --ink-2: oklch(0.83 0.01 255); --ink-3: oklch(0.7 0.012 255);
  --accent: oklch(0.74 0.12 250); --accent-soft: oklch(0.3 0.05 250); --on-accent: oklch(0.18 0.02 255);
  --up: oklch(0.76 0.14 155); --down: oklch(0.73 0.15 25); --warn: oklch(0.8 0.13 80);
  --t-news: oklch(0.74 0.12 250); --t-community: oklch(0.77 0.13 55); --t-research: oklch(0.75 0.12 300); --t-oss: oklch(0.76 0.12 160);
  --heat: oklch(0.74 0.15 50); --heat-soft: oklch(0.29 0.05 50); --heat-ink: oklch(0.82 0.12 55); --heat-hot-ink: oklch(0.17 0.02 40);
  --overlay: oklch(0 0 0 / 0.55);
  --shadow: 0 1px 0 oklch(1 0 0 / 0.04), 0 10px 30px oklch(0 0 0 / 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, h5 { margin: 0; line-height: 1.35; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--ink-3); }

/* 상단 고정 바 */
.demo-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 16px; font-size: 12.5px; background: var(--heat-soft); color: var(--heat-ink); border-bottom: 1px solid var(--line); }
.demo-bar b { font-weight: 700; }
.demo-bar nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.demo-bar nav a { text-decoration: none; padding: 2px 9px; border-radius: 6px; color: var(--ink-2); }
.demo-bar nav a[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; }

.app-head { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 20px; background: color-mix(in oklab, var(--surface) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.logo { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 800; }
.spacer { flex: 1; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font-size: 13.5px; padding: 5px 12px; border-radius: 7px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px oklch(0.2 0.02 255 / 0.14); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.icon-btn:hover { color: var(--ink); }
.head-link { font-size: 13.5px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.head-link:hover { color: var(--ink); }

/* 태그 · 영향 · 트랙 */
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 6px; white-space: nowrap; line-height: 1.7; }
.tag.field { color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); }
.tag.product { color: var(--ink-2); border: 1px dashed var(--line); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.d-news { background: var(--t-news); } .d-community { background: var(--t-community); } .d-research { background: var(--t-research); } .d-oss { background: var(--t-oss); }
.impact { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.i-opp { color: var(--up); background: color-mix(in oklab, var(--up) 13%, transparent); }
.i-risk { color: var(--down); background: color-mix(in oklab, var(--down) 12%, transparent); }
.i-watch { color: var(--ink-2); background: var(--surface-2); }
.new-badge { font-size: 10.5px; font-weight: 700; color: var(--heat-ink); background: var(--heat-soft); padding: 0 5px; border-radius: 4px; margin-left: 4px; }
.kwchips { display: flex; flex-wrap: wrap; gap: 6px; }
.kwchips span, .kwchips button { font-size: 12.5px; padding: 2px 9px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); border: 0; }
.kwchips .hot { background: var(--heat-soft); color: var(--heat-ink); font-weight: 600; }
.spark { display: block; overflow: visible; }

/* 기사 상세 시트 (B·C 공용) */
.sheet-backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 50; }
.sheet { position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); box-shadow: var(--shadow); padding: 22px 24px 32px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.sheet h2 { font-size: 21px; font-weight: 700; line-height: 1.4; }
.sheet .orig { font-size: 13px; color: var(--ink-3); }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink); font-size: 15.5px; line-height: 1.75; }
.sheet .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.sheet h4 { font-size: 13px; color: var(--ink-3); font-weight: 600; margin-top: 6px; }
.sheet .related { display: grid; gap: 8px; }
.sheet .related button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 12px; font-size: 14px; line-height: 1.45; }
.sheet .close { justify-self: end; }
.sheet .src-link { font-size: 13.5px; color: var(--accent); }

/* 시안 B: 패싯 240px / 피드 / 인사이트 300px */
:root { --b: oklch(0.5 0.16 262); --b-soft: oklch(0.955 0.03 262); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --b: oklch(0.74 0.13 262); --b-soft: oklch(0.29 0.05 262); } }
:root[data-theme="dark"] { --b: oklch(0.74 0.13 262); --b-soft: oklch(0.29 0.05 262); }
.logo { background: var(--b); }
.search { flex: 1 1 280px; max-width: 480px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 0 10px; min-width: 0; }
.search input { border: 0; background: transparent; padding: 7px 0; flex: 1; min-width: 0; outline: none; font-size: 14px; }
.search kbd { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.search:focus-within { border-color: var(--b); }
.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr) 300px; max-width: 1440px; margin-inline: auto; }
.facets { position: sticky; top: 57px; align-self: start; max-height: calc(100vh - 57px); overflow-y: auto; padding: 18px 14px 40px; border-right: 1px solid var(--line); display: grid; gap: 20px; background: var(--surface); }
.facet { display: grid; gap: 2px; }
.facet h3 { font-size: 12.5px; font-weight: 700; color: var(--ink-3); display: flex; justify-content: space-between; margin-bottom: 4px; }
.facet h3 button { border: 0; background: none; font-size: 12px; color: var(--b); padding: 0; font-weight: 500; }
.facet label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.facet label:hover { background: var(--surface-2); }
.facet label .num { margin-left: auto; font-size: 12px; color: var(--ink-3); }
.facet label.zero { opacity: .45; }
.facet input { accent-color: var(--b); margin: 0; }
.facet label:has(input:checked) { color: var(--ink); font-weight: 600; background: var(--b-soft); }
.facet .more { border: 0; background: none; color: var(--b); font-size: 12.5px; text-align: left; padding: 4px 6px; }
.feed { padding: 16px 24px 60px; display: grid; gap: 12px; align-content: start; min-width: 0; background: var(--surface); }
.activebar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 28px; }
.chip { font-size: 13px; background: var(--b-soft); color: var(--b); border: 0; border-radius: 999px; padding: 3px 11px; font-weight: 600; white-space: nowrap; }
.filterbtn { display: none; font-size: 13px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-weight: 600; }
.clear { border: 0; background: none; font-size: 12.5px; color: var(--ink-3); text-decoration: underline; }
.count { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-3); border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.count b { color: var(--ink); }
.count select { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 8px; font-size: 13px; }
.list { display: grid; content-visibility: auto; }
.row { display: grid; gap: 6px; padding: 16px 4px; border-bottom: 1px solid var(--line); text-align: left; border-left: 0; border-right: 0; border-top: 0; background: none; width: 100%; }
.row:hover h3 { color: var(--b); }
.row-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); }
.row-meta .src { display: inline-flex; align-items: center; gap: 5px; }
.row-meta time { margin-left: auto; }
.row h3 { font-size: 16.5px; font-weight: 600; line-height: 1.45; }
.row p { font-size: 14.5px; color: var(--ink-2); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); }
.row-foot .kw { color: var(--b); }
.empty { padding: 40px 0; text-align: center; color: var(--ink-3); display: grid; gap: 8px; justify-items: center; }
.side { position: sticky; top: 57px; align-self: start; max-height: calc(100vh - 57px); overflow-y: auto; border-left: 1px solid var(--line); padding: 18px 16px 40px; display: grid; gap: 24px; }
.card h3 { font-size: 13.5px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.card h3 span { font-size: 12px; font-weight: 400; color: var(--ink-3); }
.kwrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) 58px 48px; gap: 6px; align-items: center; font-size: 13.5px; padding: 3px 0; }
.kwrow .rank { color: var(--ink-3); font-size: 12px; }
.kwrow .num { font-size: 12px; text-align: right; }
.share { display: grid; gap: 7px; }
.share div { display: grid; grid-template-columns: 96px minmax(0, 1fr) 36px; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.share .bar { height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.share .bar i { display: block; height: 100%; background: var(--b); border-radius: 4px; }
.share .num { font-size: 12px; text-align: right; color: var(--ink-3); }
.impacts { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
.impacts i { display: block; height: 100%; }
.impact-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.tabs, .bottom, .facet-sheet-head { display: none; }

@media (max-width: 1180px) {
  .layout { grid-template-columns: minmax(0, 1fr) 280px; }
  .facets { display: none; }
  .filterbtn { display: inline-flex; }
  body.facets-open .facets { display: grid; position: fixed; inset: 0 auto 0 0; width: min(340px, 90vw); max-height: none; z-index: 60; box-shadow: var(--shadow); border-right: 1px solid var(--line); }
  body.facets-open .facet-backdrop { display: block; }
  .facet-sheet-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
}
.facet-backdrop { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 55; }
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; position: static; max-height: none; border-left: 0; }
  body.tab-insight .side { display: grid; }
  body.tab-insight .feed { display: none; }
  .tabs { display: flex; position: sticky; top: 103px; z-index: 20; border-bottom: 1px solid var(--line); background: var(--surface); }
  .tabs button { flex: 1; border: 0; background: none; font-size: 14px; padding: 10px 0; color: var(--ink-3); }
  .tabs button[aria-selected="true"] { color: var(--b); font-weight: 700; box-shadow: inset 0 -2px 0 var(--b); }
  .app-head { padding: 8px 16px; gap: 8px; }
  .app-head .head-link { display: none; }
  .search { order: 5; flex-basis: 100%; max-width: none; }
  .feed { padding: 12px 16px 90px; }
  .row-meta time { margin-left: 0; }
  .bottom { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bottom a { text-align: center; font-size: 11.5px; padding: 8px 0 10px; color: var(--ink-3); text-decoration: none; display: grid; gap: 3px; justify-items: center; }
  .bottom a i { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid currentColor; display: block; }
  .bottom a[aria-current="page"] { color: var(--b); font-weight: 700; }
}
</style>
</head>
<body>
<div class="demo-bar"><b>예시 데이터</b> 시안 B · 탐색 워크벤치형 — 실제 수집 데이터가 아닙니다
  <nav aria-label="시안"><a href="mockup-a-briefing.html">A 브리핑</a><a href="mockup-b-explore.html" aria-current="page">B 탐색</a><a href="mockup-c-radar.html">C 레이더</a></nav>
</div>
<header class="app-head">
  <a class="brand" href="#"><span class="logo">DX</span>DX 인텔리전스</a>
  <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="기사·키워드·출처 검색" aria-label="검색"><kbd>/</kbd></label>
  <div class="seg" id="period" aria-label="기간">
    <button aria-pressed="false" data-h="24">1일</button><button aria-pressed="true" data-h="168">7일</button><button aria-pressed="false" data-h="720">30일</button><button aria-pressed="false" data-h="100000">전체</button>
  </div>
  <span class="spacer"></span>
  <a class="head-link" href="mockup-a-briefing.html">오늘 브리핑</a>
  <a class="head-link" href="mockup-c-radar.html">리포트</a>
  <button class="icon-btn" id="theme" aria-label="밝게/어둡게 전환">◐</button>
</header>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="feed">피드</button><button role="tab" aria-selected="false" data-tab="insight">인사이트</button></div>
<div class="facet-backdrop" id="facet-bd"></div>
<div class="layout">
  <aside class="facets" id="facets" aria-label="필터">
    <div class="facet-sheet-head"><span>필터</span><button class="icon-btn" id="facets-close">닫기 ✕</button></div>
    <div id="facet-body" style="display:grid;gap:20px"></div>
  </aside>
  <section class="feed" aria-label="기사 목록">
    <div class="activebar" id="active"></div>
    <div class="count"><span id="count"></span>
      <label>정렬 <select id="sort"><option value="recent">최신순</option><option value="impact">영향 큰 순</option><option value="signal">반응 지표 순</option></select></label>
    </div>
    <div class="list" id="list"></div>
  </section>
  <aside class="side" aria-label="인사이트">
    <div class="card"><h3>급상승 키워드 <span>선택 범위 · 이전 4주 대비</span></h3><div id="kw"></div></div>
    <div class="card"><h3>분야 점유율 <span>선택 범위</span></h3><div class="share" id="share"></div></div>
    <div class="card"><h3>영향 분포</h3><div class="impacts" id="impacts"></div><div class="impact-legend" id="impact-legend"></div></div>
    <div class="card"><h3>함께 언급된 키워드</h3><div class="kwchips" id="co"></div></div>
  </aside>
</div>
<nav class="bottom" aria-label="주요 메뉴"><a href="mockup-a-briefing.html"><i></i>오늘</a><a href="#" aria-current="page"><i></i>탐색</a><a href="mockup-c-radar.html"><i></i>리포트</a><a href="#"><i></i>저장</a></nav>
<script>
// 예시(가라) 데이터 — 실제 수집 데이터가 아닙니다. 분류 키는 R2의 taxonomy.yaml 초안과 같습니다.

function hoursLabel(h) { return h < 1 ? '방금' : h < 24 ? h + '시간 전' : Math.round(h / 24) + '일 전'; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function spark(values, w, h, color, fill) {
  var max = Math.max.apply(null, values), min = Math.min.apply(null, values);
  var span = max - min || 1, step = w / (values.length - 1);
  var pts = values.map(function (v, i) { return [i * step, h - 2 - ((v - min) / span) * (h - 4)]; });
  var line = pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  var last = pts[pts.length - 1];
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
    (fill === false ? '' : '<polygon points="0,' + h + ' ' + line + ' ' + w + ',' + h + '" fill="' + color + '" fill-opacity="0.14"></polygon>') +
    '<polyline points="' + line + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linejoin="round"></polyline>' +
    '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.4" fill="' + color + '"></circle></svg>';
}
function countBy(list, key) {
  var c = {};
  list.forEach(function (a) { (Array.isArray(a[key]) ? a[key] : [a[key]]).forEach(function (v) { c[v] = (c[v] || 0) + 1; }); });
  return c;
}

      if (a.h > state.h) return false;
      if (!q) return true;
      return (a.t + ' ' + (a.o || '') + ' ' + a.s.join(' ') + ' ' + a.kw.join(' ') + ' ' + a.src).toLowerCase().indexOf(q) >= 0;
    });
  }
  function matches(a, skip) {
    return FACETS.every(function (F) {
      if (F.key === skip) return true;
      var on = Object.keys(state.sel[F.key]).filter(function (k) { return state.sel[F.key][k]; });
      return !on.length || vals(a, F.key).some(function (v) { return on.indexOf(v) >= 0; });
    });
  }
  function selected() { return base().filter(function (a) { return matches(a); }); }

  function renderFacets() {
    var b = base();
    document.getElementById('facet-body').innerHTML = FACETS.map(function (F) {
      var counts = countBy(b.filter(function (a) { return matches(a, F.key); }), F.key);
      var keys = Object.keys(F.labels).sort(function (x, y) { return (counts[y] || 0) - (counts[x] || 0); });
      var anyOn = keys.some(function (k) { return state.sel[F.key][k]; });
      var shown = F.limit && !state.more[F.key] ? keys.slice(0, F.limit) : keys;
      return '<div class="facet"><h3>' + F.title + (anyOn ? '<button data-reset="' + F.key + '">초기화</button>' : '') + '</h3>' +
        shown.map(function (k) {
          var id = 'fc-' + F.key + '-' + k, n = counts[k] || 0;
          return '<label class="' + (n ? '' : 'zero') + '" for="' + id + '"><input type="checkbox" id="' + id + '" data-facet="' + F.key + '" data-key="' + k + '"' + (state.sel[F.key][k] ? ' checked' : '') + '>' +
            (F.key === 'tr' ? '<span class="dot d-' + k + '"></span>' : '') + F.labels[k] + '<span class="num">' + n + '</span></label>';
        }).join('') +
        (F.limit && keys.length > F.limit ? '<button class="more" data-more="' + F.key + '">' + (state.more[F.key] ? '접기' : '+ ' + (keys.length - F.limit) + '개 더 보기') + '</button>' : '') + '</div>';
    }).join('');
  }

  function renderList(list) {
    var sorted = list.slice().sort(function (x, y) {
      if (state.sort === 'impact') return IMPACT_ORDER[x.im] - IMPACT_ORDER[y.im] || x.h - y.h;
      if (state.sort === 'signal') return (y.m ? 1 : 0) - (x.m ? 1 : 0) || x.h - y.h;
      return x.h - y.h;
    });
    var nSel = FACETS.reduce(function (n, F) { return n + Object.keys(state.sel[F.key]).filter(function (k) { return state.sel[F.key][k]; }).length; }, 0);
    document.getElementById('active').innerHTML = '<button class="filterbtn" id="facets-open">필터' + (nSel ? ' ' + nSel : '') + '</button>' +
      FACETS.map(function (F) { return Object.keys(state.sel[F.key]).filter(function (k) { return state.sel[F.key][k]; }).map(function (k) { return '<button class="chip" data-unset="' + F.key + ':' + k + '">' + F.labels[k] + ' ✕</button>'; }).join(''); }).join('') +
      (state.q ? '<button class="chip" data-unset="q:">"' + esc(state.q) + '" ✕</button>' : '') +
      (nSel || state.q ? '<button class="clear" id="clear">모두 지우기</button>' : '<span class="muted" style="font-size:13px">왼쪽에서 분야·제품군을 고르세요</span>');
    var clusters = Math.max(1, Math.round(list.length * 0.72));
    document.getElementById('count').innerHTML = '<b class="num">' + list.length + '</b>건 · 사건 묶음 <b class="num">' + (list.length ? clusters : 0) + '</b>개';
    document.getElementById('list').innerHTML = sorted.length ? sorted.map(function (a) {
      return '<button class="row" data-article="' + ARTICLES.indexOf(a) + '">' +
        '<span class="row-meta">' + a.f.map(function (f) { return '<span class="tag field">' + FIELD[f] + '</span>'; }).join('') + a.p.map(function (p) { return '<span class="tag product">' + PRODUCT[p] + '</span>'; }).join('') +
        '<span class="src"><span class="dot d-' + a.tr + '"></span>' + esc(a.src) + '</span><time>' + hoursLabel(a.h) + '</time></span>' +
        '<h3>' + esc(a.t) + '</h3><p>' + esc(a.s.join(' ')) + '</p>' +
        '<span class="row-foot"><span class="impact ' + IMPACT[a.im][0] + '">' + IMPACT[a.im][1] + '</span>' + (a.m ? '<span class="num">' + a.m + '</span>' : '') + '<span>' + REGION[a.rg] + '</span><span class="kw">' + a.kw.map(function (k) { return '#' + esc(k); }).join(' ') + '</span></span></button>';
    }).join('') : '<div class="empty"><b>조건에 맞는 기사가 없습니다</b><span>기간을 넓히거나 필터를 하나 지워 보세요.</span></div>';
  }

  function renderSide(list) {
    var kwc = {};
    list.forEach(function (a) { a.kw.forEach(function (k) { kwc[k] = (kwc[k] || 0) + 1; }); });
    var trend = {}; KEYWORDS.forEach(function (k) { trend[k.k] = k; });
    var top = Object.keys(kwc).sort(function (a, b) { return (trend[b] ? trend[b].z : 0) - (trend[a] ? trend[a].z : 0) || kwc[b] - kwc[a]; }).slice(0, 6);
    document.getElementById('kw').innerHTML = top.length ? top.map(function (k, i) {
      var t = trend[k], s = t ? t.s : [1, 1, 2, 1, 2, 2, 2, kwc[k] + 1];
      var d = t ? t.d : '+' + (kwc[k] * 20) + '%';
      var neg = d.indexOf('−') === 0;
      return '<div class="kwrow"><span class="rank num">' + (i + 1) + '</span><span>' + esc(k) + (t && t.state === 'new' ? '<span class="new-badge">NEW</span>' : '') + '</span>' + spark(s, 58, 18, neg ? 'var(--down)' : 'var(--b)') + '<span class="num ' + (neg ? 'down' : 'up') + '">' + d + '</span></div>';
    }).join('') : '<p class="muted" style="font-size:13px">선택 범위에 키워드가 없습니다.</p>';
    var fc = countBy(list, 'f'), tot = list.length || 1;
    document.getElementById('share').innerHTML = Object.keys(fc).sort(function (a, b) { return fc[b] - fc[a]; }).slice(0, 7).map(function (f) {
      var v = Math.round(fc[f] / tot * 100);
      return '<div><span>' + FIELD[f] + '</span><span class="bar"><i style="width:' + v + '%"></i></span><span class="num">' + v + '%</span></div>';
    }).join('');
    var ic = countBy(list, 'im'), colors = { opp: 'var(--up)', risk: 'var(--down)', watch: 'var(--ink-3)' };
    document.getElementById('impacts').innerHTML = ['opp', 'risk', 'watch'].map(function (k) { return '<i style="width:' + ((ic[k] || 0) / tot * 100) + '%;background:' + colors[k] + '"></i>'; }).join('');
    document.getElementById('impact-legend').innerHTML = ['opp', 'risk', 'watch'].map(function (k) { return '<span>' + IMPACT[k][1] + ' <b class="num">' + (ic[k] || 0) + '</b></span>'; }).join('');
    var co = Object.keys(kwc).filter(function (k) { return top.indexOf(k) < 0; }).sort(function (a, b) { return kwc[b] - kwc[a]; }).slice(0, 8);
    document.getElementById('co').innerHTML = co.map(function (k) { return '<button data-q="' + esc(k) + '">' + esc(k) + '</button>'; }).join('');
  }

  function render() { renderFacets(); var list = selected(); renderList(list); renderSide(list); }

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.facet) { state.sel[t.dataset.facet][t.dataset.key] = t.checked; render(); }
    if (t.id === 'sort') { state.sort = t.value; render(); }
  });
  var qEl = document.getElementById('q'), timer;
  qEl.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { state.q = qEl.value; render(); }, 120); });
  document.addEventListener('keydown', function (e) { if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); } });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.reset) { state.sel[b.dataset.reset] = {}; render(); }
    else if (b.dataset.more) { state.more[b.dataset.more] = !state.more[b.dataset.more]; renderFacets(); }
    else if (b.dataset.unset) { var p = b.dataset.unset.split(':'); if (p[0] === 'q') { state.q = ''; qEl.value = ''; } else state.sel[p[0]][p[1]] = false; render(); }
    else if (b.id === 'clear') { FACETS.forEach(function (F) { state.sel[F.key] = {}; }); state.q = ''; qEl.value = ''; render(); }
    else if (b.dataset.q) { state.q = b.dataset.q; qEl.value = b.dataset.q; render(); }
    else if (b.dataset.h) { document.querySelectorAll('#period button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); state.h = +b.dataset.h; render(); }
    else if (b.dataset.tab) { document.querySelectorAll('.tabs button').forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); }); document.body.classList.toggle('tab-insight', b.dataset.tab === 'insight'); }
    else if (b.id === 'facets-open') document.body.classList.add('facets-open');
    else if (b.id === 'facets-close') document.body.classList.remove('facets-open');
  });
  document.getElementById('facet-bd').addEventListener('click', function () { document.body.classList.remove('facets-open'); });

  state.sel.f.ai = true;
  render();
  initTheme();
})();
</script>
</body>
</html>
