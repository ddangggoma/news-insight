<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시안 A · 브리핑형 — DX 인텔리전스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 공통 토큰: 시안 A·B·C가 함께 쓰는 디자인 시스템 초안 (계획서 02장) */
:root {
  --bg: oklch(0.985 0.003 250);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.965 0.006 250);
  --line: oklch(0.91 0.008 250);
  --ink: oklch(0.22 0.02 255);
  --ink-2: oklch(0.38 0.02 255);
  --ink-3: oklch(0.5 0.015 255);
  --accent: oklch(0.5 0.13 250);
  --accent-soft: oklch(0.95 0.03 250);
  --on-accent: oklch(0.99 0 0);
  --up: oklch(0.5 0.13 155);
  --down: oklch(0.55 0.18 25);
  --warn: oklch(0.58 0.13 70);
  --t-news: oklch(0.52 0.13 250);
  --t-community: oklch(0.56 0.15 50);
  --t-research: oklch(0.5 0.14 300);
  --t-oss: oklch(0.5 0.12 160);
  --heat: oklch(0.66 0.17 45);
  --heat-soft: oklch(0.965 0.03 60);
  --heat-ink: oklch(0.47 0.14 40);
  --heat-hot-ink: oklch(0.2 0.03 40);
  --overlay: oklch(0.2 0.02 255 / 0.4);
  --shadow: 0 1px 2px oklch(0.2 0.02 255 / 0.06), 0 10px 30px oklch(0.2 0.02 255 / 0.08);
  --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.17 0.01 255); --surface: oklch(0.21 0.012 255); --surface-2: oklch(0.25 0.014 255);
    --line: oklch(0.32 0.014 255); --ink: oklch(0.95 0.005 255); --ink-2: oklch(0.83 0.01 255); --ink-3: oklch(0.7 0.012 255);
    --accent: oklch(0.74 0.12 250); --accent-soft: oklch(0.3 0.05 250); --on-accent: oklch(0.18 0.02 255);
    --up: oklch(0.76 0.14 155); --down: oklch(0.73 0.15 25); --warn: oklch(0.8 0.13 80);
    --t-news: oklch(0.74 0.12 250); --t-community: oklch(0.77 0.13 55); --t-research: oklch(0.75 0.12 300); --t-oss: oklch(0.76 0.12 160);
    --heat: oklch(0.74 0.15 50); --heat-soft: oklch(0.29 0.05 50); --heat-ink: oklch(0.82 0.12 55); --heat-hot-ink: oklch(0.17 0.02 40);
    --overlay: oklch(0 0 0 / 0.55);
    --shadow: 0 1px 0 oklch(1 0 0 / 0.04), 0 10px 30px oklch(0 0 0 / 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.17 0.01 255); --surface: oklch(0.21 0.012 255); --surface-2: oklch(0.25 0.014 255);
  --line: oklch(0.32 0.014 255); --ink: oklch(0.95 0.005 255); --ink-2: oklch(0.83 0.01 255); --ink-3: oklch(0.7 0.012 255);
  --accent: oklch(0.74 0.12 250); --accent-soft: oklch(0.3 0.05 250); --on-accent: oklch(0.18 0.02 255);
  --up: oklch(0.76 0.14 155); --down: oklch(0.73 0.15 25); --warn: oklch(0.8 0.13 80);
  --t-news: oklch(0.74 0.12 250); --t-community: oklch(0.77 0.13 55); --t-research: oklch(0.75 0.12 300); --t-oss: oklch(0.76 0.12 160);
  --heat: oklch(0.74 0.15 50); --heat-soft: oklch(0.29 0.05 50); --heat-ink: oklch(0.82 0.12 55); --heat-hot-ink: oklch(0.17 0.02 40);
  --overlay: oklch(0 0 0 / 0.55);
  --shadow: 0 1px 0 oklch(1 0 0 / 0.04), 0 10px 30px oklch(0 0 0 / 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, h5 { margin: 0; line-height: 1.35; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--ink-3); }

/* 상단 고정 바 */
.demo-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 16px; font-size: 12.5px; background: var(--heat-soft); color: var(--heat-ink); border-bottom: 1px solid var(--line); }
.demo-bar b { font-weight: 700; }
.demo-bar nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.demo-bar nav a { text-decoration: none; padding: 2px 9px; border-radius: 6px; color: var(--ink-2); }
.demo-bar nav a[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; }

.app-head { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 20px; background: color-mix(in oklab, var(--surface) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.logo { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 800; }
.spacer { flex: 1; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font-size: 13.5px; padding: 5px 12px; border-radius: 7px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px oklch(0.2 0.02 255 / 0.14); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.icon-btn:hover { color: var(--ink); }
.head-link { font-size: 13.5px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.head-link:hover { color: var(--ink); }

/* 태그 · 영향 · 트랙 */
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 6px; white-space: nowrap; line-height: 1.7; }
.tag.field { color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); }
.tag.product { color: var(--ink-2); border: 1px dashed var(--line); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.d-news { background: var(--t-news); } .d-community { background: var(--t-community); } .d-research { background: var(--t-research); } .d-oss { background: var(--t-oss); }
.impact { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.i-opp { color: var(--up); background: color-mix(in oklab, var(--up) 13%, transparent); }
.i-risk { color: var(--down); background: color-mix(in oklab, var(--down) 12%, transparent); }
.i-watch { color: var(--ink-2); background: var(--surface-2); }
.new-badge { font-size: 10.5px; font-weight: 700; color: var(--heat-ink); background: var(--heat-soft); padding: 0 5px; border-radius: 4px; margin-left: 4px; }
.kwchips { display: flex; flex-wrap: wrap; gap: 6px; }
.kwchips span, .kwchips button { font-size: 12.5px; padding: 2px 9px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); border: 0; }
.kwchips .hot { background: var(--heat-soft); color: var(--heat-ink); font-weight: 600; }
.spark { display: block; overflow: visible; }

/* 기사 상세 시트 (B·C 공용) */
.sheet-backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 50; }
.sheet { position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); box-shadow: var(--shadow); padding: 22px 24px 32px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.sheet h2 { font-size: 21px; font-weight: 700; line-height: 1.4; }
.sheet .orig { font-size: 13px; color: var(--ink-3); }
.sheet ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink); font-size: 15.5px; line-height: 1.75; }
.sheet .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.sheet h4 { font-size: 13px; color: var(--ink-3); font-weight: 600; margin-top: 6px; }
.sheet .related { display: grid; gap: 8px; }
.sheet .related button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 12px; font-size: 14px; line-height: 1.45; }
.sheet .close { justify-self: end; }
.sheet .src-link { font-size: 13.5px; color: var(--accent); }

/* 시안 A: 읽기 중심 3단 (목차 / 본문 660px / 숫자) */
:root { --a: oklch(0.47 0.09 195); --a-soft: oklch(0.955 0.025 195); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --a: oklch(0.77 0.09 195); --a-soft: oklch(0.29 0.04 195); } }
:root[data-theme="dark"] { --a: oklch(0.77 0.09 195); --a-soft: oklch(0.29 0.04 195); }
.logo { background: var(--a); }
.seg button[aria-pressed="true"] { color: var(--a); }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr) 280px; max-width: 1360px; margin-inline: auto; }
.toc { position: sticky; top: 57px; align-self: start; max-height: calc(100vh - 57px); overflow-y: auto; padding: 24px 14px; display: grid; gap: 2px; border-right: 1px solid var(--line); }
.toc h4 { font-size: 12px; color: var(--ink-3); font-weight: 600; margin: 10px 8px 6px; }
.toc a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 9px; border-radius: 7px; color: var(--ink-2); text-decoration: none; font-size: 14px; }
.toc a:hover { background: var(--surface-2); color: var(--ink); }
.toc a.on { background: var(--a-soft); color: var(--a); font-weight: 600; }
.toc a .num { font-size: 12px; color: var(--ink-3); }
.chips { display: none; }
main { padding: 36px 44px 80px; display: grid; gap: 40px; align-content: start; background: var(--surface); min-width: 0; }
.read { max-width: 680px; display: grid; gap: 16px; }
.meta { font-size: 13.5px; color: var(--ink-3); display: flex; gap: 12px; flex-wrap: wrap; }
.meta b { color: var(--a); }
h1.headline { font-size: clamp(24px, 3.2vw, 32px); font-weight: 700; letter-spacing: -0.015em; line-height: 1.3; }
.overview { font-size: 17px; line-height: 1.85; color: var(--ink-2); }
.insights { display: grid; border-top: 2px solid var(--ink); }
.ins { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.ins h3 { font-size: 17px; font-weight: 600; }
.ins p { grid-column: 1 / -1; font-size: 15.5px; color: var(--ink-2); line-height: 1.75; }
.ins .ev { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.sec { max-width: 680px; display: grid; gap: 12px; scroll-margin-top: 80px; }
.sec h2 { font-size: 20px; font-weight: 700; display: flex; align-items: baseline; gap: 10px; }
.sec h2 .num { font-size: 13px; color: var(--ink-3); font-weight: 400; }
.sec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.sec li button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px 9px 22px; border-radius: 8px; position: relative; display: grid; gap: 2px; }
.sec li button:hover { background: var(--surface-2); }
.sec li button::before { content: ""; position: absolute; left: 8px; top: 1.15em; width: 6px; height: 6px; border-radius: 50%; background: var(--a); }
.sec li .tt { font-size: 16px; font-weight: 600; line-height: 1.5; }
.sec li .ss { font-size: 15px; color: var(--ink-2); line-height: 1.7; }
.sec li .src { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
aside.side { padding: 24px 18px; display: grid; gap: 26px; align-content: start; border-left: 1px solid var(--line); position: sticky; top: 57px; align-self: start; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.stat span { font-size: 12.5px; color: var(--ink-3); display: block; }
.stat b { font-size: 24px; font-weight: 600; }
.stat small { font-size: 12px; display: block; }
.side h3 { font-size: 13.5px; font-weight: 700; margin-bottom: 10px; }
.kw { display: grid; grid-template-columns: minmax(0, 1fr) 60px 52px; gap: 6px; align-items: center; font-size: 13.5px; padding: 3px 0; }
.kw .num { font-size: 12px; text-align: right; }
.mix { display: flex; height: 10px; border-radius: 5px; overflow: hidden; }
.mix i { display: block; height: 100%; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: flex; align-items: center; gap: 6px; }
.regions { display: grid; gap: 6px; }
.regions div { display: grid; grid-template-columns: 60px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--a); border-radius: 3px; }
.regions .num { font-size: 11.5px; color: var(--ink-3); text-align: right; }
.archive { display: grid; gap: 2px; }
.archive a { display: grid; gap: 1px; text-decoration: none; padding: 7px 8px; border-radius: 7px; }
.archive a:hover { background: var(--surface-2); }
.archive a span { font-size: 12px; color: var(--ink-3); }
.archive a b { font-size: 13.5px; font-weight: 500; line-height: 1.45; }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 200px minmax(0, 1fr); }
  aside.side { grid-column: 1 / -1; position: static; border-left: 0; border-top: 1px solid var(--line); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  main { padding: 28px 28px 48px; }
}
@media (max-width: 720px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .toc { display: none; }
  .chips { display: flex; position: sticky; top: 57px; z-index: 20; gap: 6px; overflow-x: auto; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .chips a { font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; color: var(--ink-2); text-decoration: none; }
  .chips a.on { background: var(--a); border-color: var(--a); color: var(--on-accent); }
  main { padding: 22px 16px 40px; gap: 32px; }
  .overview { font-size: 16px; }
  .app-head { padding: 10px 16px; }
  .app-head .head-link { display: none; }
  .sec { scroll-margin-top: 120px; }
}
</style>
</head>
<body>
<div class="demo-bar"><b>예시 데이터</b> 시안 A · 브리핑형 — 실제 수집 데이터가 아닙니다
  <nav aria-label="시안"><a href="mockup-a-briefing.html" aria-current="page">A 브리핑</a><a href="mockup-b-explore.html">B 탐색</a><a href="mockup-c-radar.html">C 레이더</a></nav>
</div>
<header class="app-head">
  <a class="brand" href="#top"><span class="logo">DX</span>DX 인텔리전스</a>
  <div class="seg" id="period" aria-label="기간">
    <button aria-pressed="true" data-p="day">일간</button><button aria-pressed="false" data-p="week">주간</button><button aria-pressed="false" data-p="month">월간</button><button aria-pressed="false" data-p="quarter">분기</button>
  </div>
  <span class="spacer"></span>
  <a class="head-link" href="mockup-b-explore.html">탐색</a>
  <a class="head-link" href="mockup-c-radar.html">리포트</a>
  <a class="head-link" href="#archive">아카이브</a>
  <button class="icon-btn" id="theme" aria-label="밝게/어둡게 전환">◐</button>
</header>
<nav class="chips" id="chips" aria-label="분야"></nav>
<div class="layout" id="top">
  <nav class="toc" id="toc" aria-label="분야 목차"></nav>
  <main>
    <article class="read">
      <div class="meta" id="meta"></div>
      <h1 class="headline" id="headline"></h1>
      <p class="overview" id="overview"></p>
      <div class="insights" id="insights"></div>
    </article>
    <div id="sections" style="display:grid;gap:40px"></div>
  </main>
  <aside class="side" aria-label="숫자로 보기">
    <div class="stats" id="stats"></div>
    <div><h3>급상승 키워드</h3><div id="kws"></div></div>
    <div><h3>트랙 구성</h3><div class="mix" id="mix"></div><div class="legend" id="mix-legend"></div></div>
    <div><h3>지역 분포</h3><div class="regions" id="regions"></div></div>
    <div id="archive"><h3>지난 브리핑</h3><div class="archive" id="archive-list"></div></div>
  </aside>
</div>
<script>
// 예시(가라) 데이터 — 실제 수집 데이터가 아닙니다. 분류 키는 R2의 taxonomy.yaml 초안과 같습니다.
var FIELD = {
  ai: '온디바이스 AI', display: '디스플레이', network: '통신·네트워크', chipset: '칩셋·부품', camera: '카메라·센서',
  power: '배터리·전력', robotics: '로보틱스', xr: 'XR·공간 컴퓨팅', health: '헬스·바이오센싱', security: '보안·프라이버시',
  platform: 'OS·플랫폼', cloud: '클라우드·엣지', mobility: '모빌리티·SDV', materials: '소재·지속가능성', policy: '정책·규제·표준',
  audio: '오디오·음향', smarthome: '스마트홈 연결', genai_service: '생성형 AI 서비스', devtools: '개발 도구·SDK',
  commerce: '결제·디지털 지갑', energy: '에너지 관리', manufacturing: '스마트 제조', quantum: '양자 기술'
};
var PRODUCT = {
  phone: '스마트폰', foldable: '폴더블', tablet_pc: '태블릿·PC', wearable: '웨어러블', tv_monitor: 'TV·모니터',
  appliance: '생활가전', home_robot_iot: '홈로봇·IoT', xr_device: 'XR 기기', network_equipment: '네트워크 장비',
  automotive: '전장', medical_device: '의료기기',
  earbuds_audio: '이어버드·오디오', smart_speaker: '스마트 스피커·허브', signage: '상업용 디스플레이', hvac: '공조·HVAC',
  home_energy: '가정용 에너지 기기', pc_peripheral: 'PC 주변기기', camera_drone: '카메라·드론'
};
var TRACK = { news: '뉴스·공식', community: '커뮤니티', research: '논문·특허', oss: '오픈소스' };
var REGION = { kr: '한국', global_en: '글로벌', jp: '일본', greater_china: '중화권', eu_other: '유럽' };

function hoursLabel(h) { return h < 1 ? '방금' : h < 24 ? h + '시간 전' : Math.round(h / 24) + '일 전'; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function spark(values, w, h, color, fill) {
  var max = Math.max.apply(null, values), min = Math.min.apply(null, values);
  var span = max - min || 1, step = w / (values.length - 1);
  var pts = values.map(function (v, i) { return [i * step, h - 2 - ((v - min) / span) * (h - 4)]; });
  var line = pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  var last = pts[pts.length - 1];
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
    (fill === false ? '' : '<polygon points="0,' + h + ' ' + line + ' ' + w + ',' + h + '" fill="' + color + '" fill-opacity="0.14"></polygon>') +
    '<polyline points="' + line + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linejoin="round"></polyline>' +
    '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.4" fill="' + color + '"></circle></svg>';
}
function countBy(list, key) {
  var c = {};
  list.forEach(function (a) { (Array.isArray(a[key]) ? a[key] : [a[key]]).forEach(function (v) { c[v] = (c[v] || 0) + 1; }); });
  return c;
}

        ['위험 신호 · 로컬 AI 프라이버시', '유럽 규제 당국 질의 보도가 4개 매체로 확산됐습니다. 데이터 처리 위치 고지가 쟁점입니다.', 'risk', 9]
      ]
    },
    month: {
      h1: '9월의 테마 지도: AI와 헬스가 만나는 기사가 두 배로',
      over: '키워드 동시출현 분석에서 "온디바이스 AI × 바이오센싱" 조합이 8월보다 2.1배 늘었습니다. 이 조합은 중화권 매체에서 먼저 등장해 평균 9일 뒤 영어권으로 확산됐습니다.',
      ins: [
        ['새로 생긴 조합 · AI × 헬스', '웨어러블 건강 지표를 기기 안에서 해석하는 기사가 늘었습니다. 의료기기 인증 이슈와 함께 묶여 등장합니다.', 'opp', 63],
        ['모멘텀 하락 · 메타버스, 미니 LED', '3개월 연속 감소해 하락 단계로 분류됐습니다. XR 관련 기사는 공간 컴퓨팅 용어로 옮겨 갔습니다.', 'watch', 41],
        ['출처 편중 경고 · 커뮤니티 비중 과다', '개발자 포럼 기사 비중이 38%로 목표 대비 높습니다. 트랙 정규화 후에도 AI 분야가 과대 대표될 수 있습니다.', 'risk', 12]
      ]
    },
    quarter: {
      h1: '3분기 성숙도 이동: 공간 컴퓨팅이 연구 중심에서 제품 리뷰 중심으로',
      over: 'XR 분야에서 논문·오픈소스 비중이 52%에서 31%로 줄고 뉴스·리뷰 비중이 늘었습니다. 상용화 단계로 넘어가는 전형적인 패턴입니다. 반대로 6G는 아직 표준 문서와 논문 비중이 70%를 넘습니다.',
      ins: [
        ['상용화 진입 · 공간 컴퓨팅', '리뷰 기사 비중 증가와 함께 가격·무게 비교가 주된 화제가 됐습니다. 1년 로드맵에 반영할 단계입니다.', 'opp', 118],
        ['관심 대비 실체 괴리 · 휴머노이드', '언론 보도는 2.4배 늘었지만 관련 오픈소스 활동과 논문 수는 거의 그대로입니다. 3–5년 관점에서 관찰할 대상입니다.', 'watch', 76],
        ['지난 분기 신호 회고', '2분기에 신규로 잡힌 키워드 22개 중 14개가 이번 분기 지속 관심으로 정착했습니다(정착률 64%).', 'watch', 22]
      ]
    }
  };
  var ARCHIVE = [
    ['10.03 (토) 일간', '배터리 교체 의무 지침 공개, 방수 설계와 충돌 쟁점'],
    ['10.02 (금) 일간', '6G 연구 일정 공개, 단말 전력 절감이 핵심 요구로'],
    ['2026-W39 주간', 'AI PC 출시 러시와 NPU 벤치마크 논쟁'],
    ['2026년 8월 월간', '스마트홈 표준 통합, 에너지 관리 기기로 확장']
  ];

  var fieldCounts = countBy(ARTICLES, 'f');
  var fieldOrder = Object.keys(FIELD).filter(function (k) { return fieldCounts[k]; }).sort(function (a, b) { return fieldCounts[b] - fieldCounts[a]; });
  var productCounts = countBy(ARTICLES, 'p');
  var productOrder = Object.keys(PRODUCT).filter(function (k) { return productCounts[k]; }).sort(function (a, b) { return productCounts[b] - productCounts[a]; }).slice(0, 5);

  function render(p) {
    var P = PERIODS[p], C = COPY[p], scale = P.n / ARTICLES.length;
    function scaled(n) { return Math.round(n * scale).toLocaleString('ko-KR'); }
    document.getElementById('meta').innerHTML = '<b>' + P.label + ' 브리핑</b><span>' + P.range + '</span><span>' + (p === 'day' ? '05:00 발행' : p === 'week' ? '월요일 06:00 발행' : '첫 영업일 발행') + '</span><span>근거 기사 <span class="num">' + P.n.toLocaleString('ko-KR') + '</span>건</span>';
    document.getElementById('headline').textContent = C.h1;
    document.getElementById('overview').textContent = C.over;
    document.getElementById('insights').innerHTML = C.ins.map(function (x) {
      return '<div class="ins"><h3>' + x[0] + '</h3><span class="ev"><span class="impact ' + IMPACT[x[2]][0] + '">' + IMPACT[x[2]][1] + '</span>근거 ' + x[3] + '건</span><p>' + x[1] + '</p></div>';
    }).join('');
    document.getElementById('toc').innerHTML = '<h4>기술 분야</h4><a class="on" href="#top">전체 요약 <span class="num">' + P.n.toLocaleString('ko-KR') + '</span></a>' +
      fieldOrder.map(function (f) { return '<a href="#sec-' + f + '">' + FIELD[f] + ' <span class="num">' + scaled(fieldCounts[f]) + '</span></a>'; }).join('') +
      '<h4>제품군</h4>' + productOrder.map(function (k) { return '<a href="mockup-b-explore.html">' + PRODUCT[k] + ' <span class="num">' + scaled(productCounts[k]) + '</span></a>'; }).join('');
    document.getElementById('chips').innerHTML = '<a class="on" href="#top">전체</a>' + fieldOrder.map(function (f) { return '<a href="#sec-' + f + '">' + FIELD[f] + '</a>'; }).join('');
    document.getElementById('sections').innerHTML = fieldOrder.slice(0, 9).map(function (f) {
      var list = ARTICLES.filter(function (a) { return a.f[0] === f; }).slice(0, 4);
      if (!list.length) list = ARTICLES.filter(function (a) { return a.f.indexOf(f) >= 0; }).slice(0, 3);
      return '<section class="sec" id="sec-' + f + '"><h2>' + FIELD[f] + ' <span class="num">' + scaled(fieldCounts[f]) + '건</span></h2><ul>' +
        list.map(function (a) {
          return '<li><button data-article="' + ARTICLES.indexOf(a) + '"><span class="tt">' + esc(a.t) + '</span><span class="ss">' + esc(a.s[0]) + '</span>' +
            '<span class="src"><span class="dot d-' + a.tr + '"></span>' + esc(a.src) + ' · ' + REGION[a.rg] + (a.p.length ? ' · ' + a.p.map(function (k) { return PRODUCT[k]; }).join(', ') : '') + ' <span class="impact ' + IMPACT[a.im][0] + '">' + IMPACT[a.im][1] + '</span></span></button></li>';
        }).join('') + '</ul></section>';
    }).join('');
    var diff = (P.n - P.prev) / P.prev * 100;
    document.getElementById('stats').innerHTML =
      '<div class="stat"><span>분석한 기사</span><b class="num">' + P.n.toLocaleString('ko-KR') + '</b><small class="num ' + (diff >= 0 ? 'up' : 'down') + '">' + (diff >= 0 ? '▲ ' : '▼ ') + Math.abs(diff).toFixed(1) + '%</small></div>' +
      '<div class="stat"><span>독립 출처</span><b class="num">' + P.sources.toLocaleString('ko-KR') + '</b><small class="muted">곳</small></div>';
    document.getElementById('kws').innerHTML = KEYWORDS.filter(function (k) { return k.state === 'rise' || k.state === 'new'; }).slice(0, 6).map(function (k) {
      return '<div class="kw"><span>' + k.k + (k.state === 'new' ? '<span class="new-badge">NEW</span>' : '') + '</span>' + spark(k.s, 60, 18, 'var(--a)') + '<span class="num up">' + k.d + '</span></div>';
    }).join('');
  }

  var tc = countBy(ARTICLES, 'tr'), total = ARTICLES.length;
  document.getElementById('mix').innerHTML = Object.keys(TRACK).map(function (t) { return '<i class="d-' + t + '" style="width:' + (tc[t] / total * 100) + '%"></i>'; }).join('');
  document.getElementById('mix-legend').innerHTML = Object.keys(TRACK).map(function (t) { return '<span><span class="dot d-' + t + '"></span>' + TRACK[t] + ' <span class="num muted">' + Math.round(tc[t] / total * 100) + '%</span></span>'; }).join('');
  var rc = countBy(ARTICLES, 'rg');
  document.getElementById('regions').innerHTML = Object.keys(REGION).map(function (r) { var v = Math.round((rc[r] || 0) / total * 100); return '<div><span>' + REGION[r] + '</span><span class="bar"><i style="width:' + v + '%"></i></span><span class="num">' + v + '%</span></div>'; }).join('');
  document.getElementById('archive-list').innerHTML = ARCHIVE.map(function (a) { return '<a href="#top"><span>' + a[0] + '</span><b>' + a[1] + '</b></a>'; }).join('');

  var btns = document.querySelectorAll('#period button');
  btns.forEach(function (b) { b.addEventListener('click', function () { btns.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); render(b.dataset.p); }); });
  render('day');
  initTheme();
})();
</script>
</body>
</html>
